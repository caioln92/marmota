<title>O Dia da marmota</title>

<style>
  :root {
    --ground: #0a0a0b;
    --fala: #efebe3;
    --ink: #a29c94;
    --dim: #5f5b56;
    --rule: #1c1b1a;
    --alarm: #c0392b;
    --obj: #6f9fc4;
    --gente: #c9a86a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--fala);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 34rem;
    margin: 0 auto;
    padding: 0 1.25rem 4rem;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--ground);
    padding: 1.25rem 0 0.9rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  #clock {
    font-family: var(--mono);
    font-size: 1.5rem;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    transition: color 0.6s ease;
  }
  #clock.baixo { color: var(--alarm); }
  #clock.escondido { opacity: 0; }

  #onde {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
    text-align: right;
    line-height: 1.6;
  }
  #onde b { color: var(--ink); font-weight: 400; }

  .linhaPergunta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1.5rem;
  }
  .linhaPergunta .pergunta { flex: 1; }

  #clockBig, .clockVoando {
    font-family: var(--mono);
    font-size: 1.5rem;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--fala);
    white-space: nowrap;
  }
  .clockVoando {
    position: fixed;
    z-index: 40;
    transform-origin: left top;
    pointer-events: none;
  }

  main {
    display: flex;
    flex-direction: column;
    gap: 1.15rem;
    font-size: 1.0625rem;
    line-height: 1.65;
  }
  main:empty { display: none; }
  main p { margin: 0; }
  main p.eco { color: var(--ink); font-style: italic; }
  main p.forte { color: #fff; }

  main .obj { color: var(--obj); }
  main .quem { color: var(--gente); }

  .cursor {
    display: inline-block;
    width: 0.5em;
    margin-left: 0.06em;
    border-bottom: 2px solid currentColor;
    animation: pisca 1s steps(1) infinite;
  }
  @keyframes pisca { 50% { opacity: 0; } }

  nav { display: flex; flex-direction: column; flex: 1; }
  nav:empty { display: none; }

  nav .pergunta {
    font-family: var(--serif);
    font-size: 1.3125rem;
    line-height: 1.3;
    color: var(--fala);
    padding: 3.25rem 0 1.4rem;
    min-height: 2.4rem;
    transition: color 0.6s ease, padding 380ms cubic-bezier(.4,0,.2,1);
  }
  nav .pergunta.urgente { color: var(--alarm); }
  nav .pergunta.colado { padding-top: 0.25rem; }

  #botoes {
    display: flex;
    flex-direction: column;
    flex: 1;
    transition: opacity 300ms ease;
  }
  #botoes.entrando { opacity: 0; }

  main.saindo { overflow: hidden; }

  button {
    appearance: none;
    background: none;
    border: 0;
    border-left: 2px solid transparent;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 0.9375rem;
    text-align: left;
    padding: 0.62rem 0.5rem 0.62rem 0.7rem;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    line-height: 1.35;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }

  button:hover, button:focus-visible {
    border-left-color: var(--fala);
    color: var(--fala);
    background: #131312;
    outline: none;
  }

  button.grupo.aberto { color: var(--fala); border-left-color: var(--obj); }
  button.pessoa { color: var(--gente); }
  button.pessoa.aberto { border-left-color: var(--gente); color: #fff; }

  button.sub {
    padding-left: 2.1rem;
    font-size: 0.875rem;
    color: var(--dim);
  }
  button.sub:hover, button.sub:focus-visible { color: var(--fala); }
  button.sub.visto { color: #4a4744; }

  button .custo {
    color: var(--dim);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  button.sub.visto .custo { color: #4a4744; }

  button.reler {
    margin-top: auto;
    padding-top: 2.2rem;
    color: var(--dim);
    font-size: 0.8rem;
    border-left-color: transparent;
  }
  button.reler:hover, button.reler:focus-visible {
    border-left-color: transparent;
    background: none;
    color: var(--ink);
  }

  #flash {
    position: fixed; inset: 0; background: #fff;
    opacity: 0; pointer-events: none; z-index: 50;
  }
  #flash.bate { animation: clarao 900ms ease-out; }
  @keyframes clarao { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    #flash.bate { animation-duration: 1ms; }
    .cursor { animation: none; }
    * { transition: none !important; }
  }

  .placar {
    font-family: var(--mono);
    font-size: 0.875rem;
    line-height: 2;
    color: var(--ink);
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 1rem 0;
    margin-top: 0.5rem;
  }
  .placar b { color: var(--fala); font-weight: 400; }
</style>

  function relogio() {
    var cs = Math.max(0, Math.floor(st.cs));
    var s = Math.floor(cs / 100);
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" +
           String(s % 60).padStart(2, "0") + ":" +
           String(cs % 100).padStart(2, "0");
  }

    return !!(window.matchMedia &&

  function plano(t) { return t.replace(/[\[\]\{\}]/g, ""); }
  function marcado(t) {
    return t.replace(/\[([^\]]+)\]/g, '<span class="obj">$1</span>')
            .replace(/\{([^\}]+)\}/g, '<span class="quem">$1</span>');
  }

  var digitacao = null, perg = null, aguardando = null, saindoTimer = null;

  function completaTexto() {
    if (!digitacao) return;
    clearInterval(digitacao.timer);
    digitacao.ps.forEach(function (p) {
      p.innerHTML = marcado(p.getAttribute("data-full"));
    });
    var cb = digitacao.fim;
    digitacao = null;
    if (cb) cb();
  }

  function pintaLinhas(linhas, classe) {
    elTexto.innerHTML = "";
    linhas.forEach(function (l) {
      var p = document.createElement("p");
      var txt;
      if (typeof l === "string") { txt = l; if (classe) p.className = classe; }
      else { txt = l.t; if (l.c) p.className = l.c; }
      p.innerHTML = marcado(txt);
      elTexto.appendChild(p);
    });
  }

  function escreve(linhas, classe, aoTerminar, instantaneo) {
    if (digitacao) { clearInterval(digitacao.timer); digitacao = null; }
    st.ultimas = { linhas: linhas, classe: classe };
    elTexto.innerHTML = "";
    elOpcoes.innerHTML = "";
    aguardando = null;

    var ps = linhas.map(function (l) {
      var p = document.createElement("p");
      var txt;
      if (typeof l === "string") { txt = l; if (classe) p.className = classe; }
      else { txt = l.t; if (l.c) p.className = l.c; }
      p.setAttribute("data-full", txt);
      elTexto.appendChild(p);
      return p;
    });
    window.scrollTo(0, 0);

    if (semAnim() || instantaneo) {
      ps.forEach(function (p) { p.innerHTML = marcado(p.getAttribute("data-full")); });
      if (aoTerminar) aoTerminar();
      return;
    }

    var i = 0, j = 0;
    var cursor = document.createElement("span");
    cursor.className = "cursor";

    digitacao = { ps: ps, fim: aoTerminar, timer: 0 };
    digitacao.timer = setInterval(function () {
      if (i >= ps.length) { completaTexto(); return; }
      var cru = plano(ps[i].getAttribute("data-full"));
      if (j < cru.length) {
        j += 1;
        ps[i].textContent = cru.slice(0, j);
        ps[i].appendChild(cursor);
      } else {
        if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
        ps[i].innerHTML = marcado(ps[i].getAttribute("data-full"));
        i += 1; j = 0;
      }
    }, 38);
  }

    if (!perg) return;
    clearTimeout(perg.pausa);
    clearInterval(perg.timer);
    perg.el.textContent = perg.txt;

    perg = null;
    poeClockBig();
    if (cb) cb();

  // enquanto tem texto na tela esperando o jogador, nenhum evento pode atropelar
  function ocupado() {
    return !!(digitacao || perg || aguardando || saindoTimer || st.morrendo);
  }

  setInterval(function () {
    var agora = Date.now();
    var dt = agora - ultimoT;
    ultimoT = agora;
    if (st.acabou || st.pausado || st.cs <= 0) return;

    st.cs -= (dt / 10) * (st.hudAtivo ? LENTO : 1);
    if (st.cs <= 0) { st.cs = 0; pintaRelogio(); morre("tempo"); return; }
    pintaRelogio();

    // o estopim acontece na hora dele, mesmo se o jogador ficar parado
    if (!st.estourou && st.cs <= ESTOPIM && st.hudAtivo && !ocupado()) estopim();

  function poeClockBig() {
    if (st.hudAtivo || !ultimaLinha) return;
    if (ultimaLinha.querySelector("#clockBig")) return;
    var c = document.createElement("div");
    c.id = "clockBig";
    c.textContent = relogio();
    ultimaLinha.appendChild(c);

    if (!semAnim()) {
      c.style.opacity = "0";
      c.style.transform = "translateY(10px)";
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          c.style.transition =
            "opacity 900ms ease, transform 900ms cubic-bezier(.4,0,.2,1)";
          c.style.opacity = "1";
          c.style.transform = "translateY(0)";
        });
      });
      setTimeout(function () { c.style.opacity = "1"; c.style.transform = "none"; }, 1000);
    }

    setTimeout(function () { st.pausado = false; }, 2000);
  }

  function linhaPergunta(classe) {
    var linha = document.createElement("div");
    linha.className = "linhaPergunta";

    d.className = classe;
    linha.appendChild(d);
    elOpcoes.appendChild(linha);

  function voaProCanto() {
    var big = document.getElementById("clockBig");
    if (!big || semAnim()) { elClock.classList.remove("escondido"); return; }
    var r1 = big.getBoundingClientRect();
    var r2 = elClock.getBoundingClientRect();
    var clone = document.createElement("div");
    clone.className = "clockVoando";
    clone.textContent = big.textContent;
    clone.style.left = r1.left + "px";
    clone.style.top = r1.top + "px";
    document.body.appendChild(clone);
    big.style.visibility = "hidden";
    void clone.offsetWidth;
    clone.style.transition = "transform 650ms cubic-bezier(.5,.05,.25,1)";
    clone.style.transform =
      "translate(" + (r2.left - r1.left) + "px," + (r2.top - r1.top) + "px)";
    setTimeout(function () {
      if (clone.parentNode) clone.remove();
      elClock.classList.remove("escondido");
    }, 680);
  }

  function perguntaAnimada(txt, aoTerminar) {
    if (perg) { clearTimeout(perg.pausa); clearInterval(perg.timer); perg = null; }
    var d = linhaPergunta("pergunta" + (st.cs <= 30000 ? " urgente" : ""));

    if (semAnim()) { d.textContent = txt; poeClockBig(); if (aoTerminar) aoTerminar(); return; }

    var lenta = !st.perguntou;
    st.perguntou = true;
    var palavras = txt.split(" ");
    var ritmo = lenta ? 420 : 200, espera = lenta ? 900 : 250, i = 0;

    perg = { el: d, txt: txt, fim: aoTerminar, timer: 0, pausa: 0 };
    perg.pausa = setTimeout(function () {
      if (!perg) return;
      perg.timer = setInterval(function () {
        if (i >= palavras.length) { completaPergunta(); return; }
        d.textContent = i === 0 ? palavras[0] : d.textContent + " " + palavras[i];
        i += 1;
      }, ritmo);

  function botao(texto, custo, onClick, classe) {
    var b = document.createElement("button");

    if (custo) {
      var c = document.createElement("span");

    if (classe) b.className = classe;

    else b.disabled = true;
    return b;
  }

  function contaDescobertas() {
    return DESCOBERTAS.filter(function (k) { return st.sabe[k]; }).length;
  }

  function nomeDe(id) {
    var p = PESSOAS[id];
    return st.sabe["nome_" + id] ? p.nome : p.apelido;
  }

  function ondeEsta(id) {
    var p = PESSOAS[id];
    if (st.mortos[id]) return null;
    if (id === "theo" && st.estourou) return st.theoLugar || null;
    var m = minutos();
    for (var i = 0; i < p.agenda.length; i++) {
      var a = p.agenda[i];
      if (m <= a[0] && m > a[1]) return a[2];
    }
    return null;
  }

  function pessoasAqui() {
    return Object.keys(PESSOAS).filter(function (id) {
      // depois do estopim o Théo não é gente pra conversar, é ameaça
      if (id === "theo" && st.estourou) return false;
      return ondeEsta(id) === st.lugar;
    });
  }

  function coisasAqui() {
    return Object.keys(COISAS).filter(function (id) {
      var c = COISAS[id];
      if (c.onde !== "*" && c.onde !== st.lugar) return false;
      return c.inicial || st.conhece[id];
    });
  }

  function assuntosCom(pid) {
    return ASSUNTOS.filter(function (a) {
      return st.sabe[a.exige] && a.resp[pid];
    });
  }

  function terminaSaida() {
    if (!saindoTimer) return;
    clearTimeout(saindoTimer);
    saindoTimer = null;
    elTexto.innerHTML = "";
    elTexto.classList.remove("saindo");
    elTexto.removeAttribute("style");
    mostraMenu();
  }

  function avancaParaMenu() {
    var cur = elOpcoes.querySelector(".pergunta .cursor");
    if (cur) cur.remove();
    if (!elTexto.childNodes.length) { mostraMenu(); return; }

    var h = elTexto.getBoundingClientRect().height;
    elTexto.classList.add("saindo");
    elTexto.style.height = h + "px";
    void elTexto.offsetWidth;
    elTexto.style.transition = "opacity 240ms ease, height 380ms cubic-bezier(.4,0,.2,1)";
    elTexto.style.opacity = "0";
    elTexto.style.height = "0px";
    var p = elOpcoes.querySelector(".pergunta");
    if (p) p.classList.add("colado");
    saindoTimer = setTimeout(terminaSaida, 340);
  }

  function relerUltima() {
    if (!st.ultimas) return;
    pintaLinhas(st.ultimas.linhas, st.ultimas.classe);
    elOpcoes.innerHTML = "";
    ultimaLinha = null;
    window.scrollTo(0, 0);
    perguntaAnimada("O que você faz?", function () { esperaClique(avancaParaMenu); });
  }

  function pedeAcao() {
    perguntaAnimada("O que você faz?", function () { esperaClique(avancaParaMenu); });
  }

  function mostraMenu() {
    var p = elOpcoes.querySelector(".pergunta");
    if (!p) {
      p = linhaPergunta("pergunta colado" + (st.cs <= 30000 ? " urgente" : ""));
      p.textContent = "O que você faz?";
      poeClockBig();
    } else {
      p.classList.add("colado");
    }

    var caixa = document.getElementById("botoes");
    var nova = !caixa;
    if (nova) {
      caixa = document.createElement("div");
      caixa.id = "botoes";
      caixa.className = "entrando";
      elOpcoes.appendChild(caixa);
    }
    caixa.innerHTML = "";

    function grupo(id, rotulo, classe, monta) {
      var aberto = st.aberto === id;
      caixa.appendChild(botao("- " + rotulo, null, function () {
        st.aberto = aberto ? null : id;
        mostraMenu();
      }, classe + (aberto ? " aberto" : "")));
      if (aberto) monta();
    }

    // pessoas primeiro: é o que muda com o relógio
    pessoasAqui().forEach(function (pid) {
      var pes = PESSOAS[pid];
      grupo("p_" + pid, nomeDe(pid), "grupo pessoa", function () {
        caixa.appendChild(botao("observar", 1, function () {
          executaPessoa(pid, "olhar", pes.olhar);
        }, "sub" + (st.vistos["p:" + pid + ":olhar"] ? " visto" : "")));
        caixa.appendChild(botao("falar", 1, function () {
          executaPessoa(pid, "falar", pes.falar);
        }, "sub" + (st.vistos["p:" + pid + ":falar"] ? " visto" : "")));
        if (!st.sabe["nome_" + pid]) {
          caixa.appendChild(botao("perguntar o nome", 1, function () {
            executaNome(pid);
          }, "sub"));
        }
        assuntosCom(pid).forEach(function (a) {
          caixa.appendChild(botao(a.label, a.custo, function () {
            executaAssunto(pid, a);
          }, "sub" + (st.vistos["a:" + pid + ":" + a.id] ? " visto" : "")));
        });
      });
    });

    coisasAqui().forEach(function (cid) {
      var c = COISAS[cid];
      grupo(cid, c.nome, "grupo", function () {
        c.acoes.forEach(function (a) {
          if (a.exige && !st.sabe[a.exige]) return;
          caixa.appendChild(botao(a.label, a.custo, function () {
            executa(cid, a);
          }, "sub" + (st.vistos[cid + ":" + a.id] ? " visto" : "")));
        });
      });
    });

    grupo("voce", VOCE.nome, "grupo", function () {
      VOCE.acoes.forEach(function (a) {
        caixa.appendChild(botao(a.label, a.custo, function () {
          executa("voce", a);
        }, "sub" + (st.vistos["voce:" + a.id] ? " visto" : "")));
      });
    });

    var saidas = (LUGARES[st.lugar].saidas || []).filter(function (s) {
      return !s.exige || st.sabe[s.exige];
    });
    if (saidas.length) {
      grupo("ir", "Ir para...", "grupo", function () {
        saidas.forEach(function (s) {
          caixa.appendChild(botao(s.label, s.custo, function () {
            vaiPara(s.id, s.custo);
          }, "sub"));
        });
      });
    }

    if (st.ultimas) caixa.appendChild(botao("↩ reler", null, relerUltima, "reler"));

    if (nova) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { caixa.classList.remove("entrando"); });
      });
    }
  }

  // ================= AÇÕES =================

  function depoisDaAcao() {
    if (st.cs <= 0) { morre("tempo"); return; }
    if (st.cs <= ESTOPIM && !st.estourou) { estopim(); return; }
    if (st.estourou && !st.pegou && st.theoLugar === st.lugar) {
      st.pegou = true; theoTeAcha(); return;
    }
    pedeAcao();
  }

  function gasta(min) {
    st.acoes++;
    st.cs -= min * 6000;
    if (st.cs < 0) st.cs = 0;
    pintaRelogio();
  }

  function antesDeAgir() {
    st.aberto = null;
    if (!st.hudAtivo) { st.hudAtivo = true; voaProCanto(); }
  }

  function vaiPara(destino, custo) {
    if (st.acabou) return;
    antesDeAgir();
    if (destino === "quarto2" && st.trancou) {
      gasta(custo);
      apresenta(["A cadeira está encaixada na maçaneta. Você mesmo botou ali.",
                 "Do lado de dentro, o quack continua."], null, depoisDaAcao);
      return;
    }
    gasta(custo);
    st.lugar = destino;
    var l = LUGARES[destino];
    if (l.revela) l.revela.forEach(function (id) { st.conhece[id] = true; });
    pintaRelogio();

    st.visitou = st.visitou || {};
    var jaEsteve = st.visitou[destino];
    st.visitou[destino] = true;
    var linhas = (jaEsteve && l.curta ? l.curta : l.chegada).slice();
    var gente = pessoasAqui().map(function (id) { return "{" + nomeDe(id) + "}"; });
    if (gente.length === 1) linhas.push(gente[0] + " está aqui.");
    else if (gente.length > 1) {
      linhas.push(gente.slice(0, -1).join(", ") + " e " + gente[gente.length - 1] + " estão aqui.");
    }
    apresenta(linhas, null, depoisDaAcao);
  }

  function executa(grupo, a) {
    if (st.acabou) return;
    antesDeAgir();
    if (a.vaiPara) {
      if (a.sabe) st.sabe[a.sabe] = true;
      st.vistos[grupo + ":" + a.id] = true;
      vaiPara(a.vaiPara, a.custo);
      return;
    }

    if (a.dorme) {
      st.dormiu++;
      gasta(a.custo);
      if (st.dormiu === 1) {
        st.sabe["sem_sono"] = true;
        apresenta(["Você deita e fecha os olhos.",
                   "Nada. Você não está com sono — nem um pouco.",
                   "Como quem não dorme faz dias. Ou como quem acordou faz muito pouco tempo."],
                  null, depoisDaAcao);
        return;
      }
      escreve(["Dessa vez você apaga na hora."], null, function () {
        setTimeout(function () { morre("dormiu"); }, 700);
      });
      return;
    }

    if (a.olharVolta) {
      gasta(a.custo);
      var l = LUGARES[st.lugar];
      if (l.revela) l.revela.forEach(function (id) { st.conhece[id] = true; });
      apresenta(l.chegada.slice(), null, depoisDaAcao);
      return;
    }

    if (a.encaixa) { encaixaMoedas(a.custo); return; }

    if (a.espia) {
      gasta(a.custo);
      st.sabe["viu_sala"] = true;
      st.vistos[grupo + ":" + a.id] = true;
      var la = Object.keys(PESSOAS).filter(function (id) { return ondeEsta(id) === "sala"; });
      var linhas = [
        "Da fresta dá pra ver uma sala grande, luz amarela, copo em cima de tudo.",
        "Do resto da casa você só vê parede e um pedaço de corredor."
      ];
      if (la.length === 1) {
        linhas.push("{" + nomeDe(la[0]) + "} está lá. Não olhou pra cá.");
      } else if (la.length > 1) {
        var nn = la.map(function (id) { return "{" + nomeDe(id) + "}"; });
        linhas.push(nn.slice(0, -1).join(", ") + " e " + nn[nn.length - 1] + " estão lá.");
      } else {
        linhas.push("Não dá pra ver ninguém daqui. As vozes vinham de algum lugar mais fundo.");
      }
      linhas.push("Pra ver o resto você vai ter que entrar.");
      apresenta(linhas, null, depoisDaAcao);
      return;
    }

    var chave = grupo + ":" + a.id;
    var jaViu = st.vistos[chave];
    st.vistos[chave] = true;

    var vazia = a.txtPrimeira && st.volta < 2;
    var linhas = vazia ? a.txtPrimeira : a.txt;

    if (a.sabe && !vazia) st.sabe[a.sabe] = true;
    if (a.pega) st.tem = (st.tem || {}), st.tem[a.pega] = true;
    if (a.revela) a.revela.forEach(function (id) { st.conhece[id] = true; });
    if (a.revelaNome && !vazia) {
      a.revelaNome.forEach(function (id) { st.sabe["nome_" + id] = true; });
    }
    if (a.trava) st.trancou = true;   // físico: não atravessa o loop

    gasta(a.custo);

    if (jaViu) apresenta([linhas[linhas.length - 1]], "eco", depoisDaAcao, true);
    else apresenta(linhas, a.eco ? "eco" : null, depoisDaAcao);
  }

  function executaPessoa(pid, tipo, linhas) {
    if (st.acabou) return;
    antesDeAgir();
    var chave = "p:" + pid + ":" + tipo;
    var jaViu = st.vistos[chave];
    st.vistos[chave] = true;
    st.sabe["viu_" + pid] = true;
    var rn = PESSOAS[pid].revelaNome;
    if (tipo === "falar" && rn) rn.forEach(function (o) { st.sabe["nome_" + o] = true; });
    gasta(1);
    if (jaViu) apresenta([linhas[linhas.length - 1]], "eco", depoisDaAcao, true);
    else apresenta(linhas, null, depoisDaAcao);
  }

  function executaNome(pid) {
    if (st.acabou) return;
    antesDeAgir();
    var p = PESSOAS[pid];
    st.sabe["nome_" + pid] = true;
    st.vistos["p:" + pid + ":nome"] = true;
    gasta(1);
    var linhas = [
      "— Qual é o seu nome?",
      "A pergunta cai errado. A pessoa te olha um segundo a mais do que precisava.",
      "— " + p.nome + ". — E depois, mais baixo: — A gente se conhece há dois anos, cara."
    ];
    if (pid === "theo") {
      linhas = [
        "— Qual é o seu nome?",
        "Ele para. Pensa. Pensa mesmo, com esforço.",
        "— Quack.",
        "E parece satisfeito com a resposta."
      ];
      st.sabe["nome_theo"] = false;
      delete st.sabe["nome_theo"];
    }
    apresenta(linhas, null, depoisDaAcao);
  }

  function executaAssunto(pid, a) {
    if (st.acabou) return;
    antesDeAgir();
    st.vistos["a:" + pid + ":" + a.id] = true;
    st.sabe["falou_" + a.id] = true;
    if (a.gatilho) st.sabe[a.gatilho] = true;
    if (a.revelaNome) a.revelaNome.forEach(function (id) { st.sabe["nome_" + id] = true; });
    if (a.dá && pid === "jennifer") { st.tem = (st.tem || {}); st.tem["moeda_jennifer"] = true; }
    gasta(a.custo);
    apresenta(a.resp[pid], null, depoisDaAcao);
  }

  function quantasMoedas() {
    var t = st.tem || {};
    return (t.moeda_bolso ? 1 : 0) + (t.moeda_cama ? 1 : 0) + (t.moeda_jennifer ? 1 : 0);
  }

  function encaixaMoedas(custo) {
    gasta(custo);
    var n = quantasMoedas();
    if (n === 0) {
      apresenta(["Você não tem nenhuma moeda no bolso."], "eco", depoisDaAcao, true);
      return;
    }
    if (n < 3) {
      apresenta(["Você encaixa o que tem. " + n + " de 3.",
                 "Os encaixes vazios continuam vazios, e a máquina continua morna."],
                null, depoisDaAcao);
      return;
    }
    st.acabou = true;
    escreve([
      { t: "A terceira moeda entra com um estalo seco." },
      { t: "A máquina esfria na sua mão de uma vez, como se tivesse morrido." },
      { t: "E o relógio no seu pulso para.", c: "forte" },
      { t: "O fecho abre sozinho. Ele cai no chão da cozinha e fica lá, marcando o mesmo número pra sempre." },
      { t: "— fim do teste —", c: "eco" }
    ], null, placar);
  }

  // ---- o estopim das 16

  function estopim() {
    st.estourou = true;
    st.theoLugar = "quarto2";
    var trancado = st.trancou;
    var semArma = (st.tem || {}).arma;

    if (trancado) {
      st.theoLugar = null;
      apresenta([
        { t: "Do fim do corredor vem um baque. Depois outro." },
        { t: "A cadeira range e segura." },
        { t: "Alguém grita do outro lado da porta — e não é o Théo. É o Tony, e ele está do lado de fora, batendo pra entrar.", c: "forte" },
        { t: "Depois de um tempo ele desiste e vai embora xingando." }
      ], null, depoisDaAcao);
      return;
    }

    if (semArma) {
      st.mortos["theo"] = true;
      st.mortos["tony"] = true;
      st.theoLugar = null;
      apresenta([
        { t: "Do quarto 2 vem grito, móvel arrastado, vidro." },
        { t: "Quando acaba, acaba rápido demais." },
        { t: "O Tony sai de lá com uma faca que você não sabia que ele tinha, e com uma cara de quem entendeu o que fez.", c: "forte" },
        { t: "Ele senta no chão do corredor. Não levanta mais." }
      ], null, depoisDaAcao);
      return;
    }

    st.mortos["tony"] = true;
    apresenta([
      { t: "Do quarto 2 vem a voz do Tony, alta, provocando: — Vira homem, porra!" },
      { t: "Silêncio." },
      { t: "E aí o tiro.", c: "forte" },
      { t: "A porta abre. O Théo sai andando pelo corredor, de cueca, com a arma na mão, fazendo quack baixinho." }
    ], null, depoisDaAcao);
  }

  function theoTeAcha() {
    if (saindoTimer) { clearTimeout(saindoTimer); saindoTimer = null; }
    apresenta([
      { t: "Ele para na porta." },
      { t: "Te vê, abre os dois braços, e faz o som." },
      { t: "Quack.", c: "forte" },
      { t: "E começa a dançar." }
    ], null, function () {
      perguntaAnimada("O que você faz?", function () {
        esperaClique(function () {
          elTexto.innerHTML = "";
          elOpcoes.innerHTML = "";
          var p = document.createElement("div");
          p.className = "pergunta colado urgente";
          p.textContent = "O que você faz?";
          elOpcoes.appendChild(p);
          ["- Falar com ele", "- Empurrar e correr", "- Ficar parado"].forEach(function (t) {
            elOpcoes.appendChild(botao(t, null, function () { morre("theo"); }, "grupo"));
          });
        });
      });
    });
  }

  // rota de caça do Théo, depois do estopim
  function atualizaTheo() {
    if (!st.estourou || st.acabou || st.pegou) return;
    if (st.mortos["theo"] || st.theoLugar === null) return;
    var m = minutos();
    var rota = [[16, 12, "sala"], [12, 8, "banheiro"], [8, 4, "cozinha"], [4, 0, "quarto1"]];
    for (var i = 0; i < rota.length; i++) {
      if (m <= rota[i][0] && m > rota[i][1]) { st.theoLugar = rota[i][2]; break; }
    }
    // ele te acha na hora — mas nunca por cima de um texto que você está lendo
    if (st.theoLugar === st.lugar && !ocupado()) {
      st.pegou = true;
      theoTeAcha();
    }
  }
  setInterval(atualizaTheo, 500);

  // ================= LOOP =================

  function morre(causa) {
    if (st.morrendo) return;   // dois cliques não valem duas voltas
    st.morrendo = true;
    aguardando = null;
    if (saindoTimer) { clearTimeout(saindoTimer); saindoTimer = null; }
    st.pausado = true;
    elFlash.classList.remove("bate");
    void elFlash.offsetWidth;
    elFlash.classList.add("bate");

    var fala = { theo: "Ele para de dançar.", tempo: "O relógio chega no fim." }[causa] || "";

    setTimeout(function () {
      st.volta++;
      st.cs = TOTAL;
      st.lugar = "quarto1";
      st.pausado = false;
      st.estourou = false;
      st.theoLugar = null;
      st.pegou = false;
      st.trancou = false;
      st.morrendo = false;
      st.mortos = {};
      st.dormiu = 0;
      st.vistos = {};
      st.tem = {};
      st.visitou = {};
      st.aberto = null;
      pintaRelogio();
      abre(fala);
    }, 700);
  }

  function abre(antes) {
    st.perguntou = false;
    var linhas;
    if (st.volta > 1) {
      linhas = [];
      if (antes) linhas.push({ t: antes, c: "eco" });
      linhas.push({ t: "Clarão branco.", c: "forte" });
      linhas.push({ t: "Você acorda no mesmo quarto." });
      linhas.push({ t: "O relógio marca 30 minutos de novo.", c: "forte" });
      linhas.push({ t: "Do outro lado da porta, as mesmas vozes." });
    } else {
      linhas = ABERTURA.slice();
    }
    apresenta(linhas, null, pedeAcao);
  }

  function placar() {
    st.acabou = true;
    var p = document.createElement("div");
    p.className = "placar";
    salvaTempo();
    manda("zerou");
    var seg = Math.round(msJogados() / 1000);
    var mm = Math.floor(seg / 60), ss = seg % 60;
    var jogando = (mm > 0 ? mm + " min " : "") + ss + " s";

    p.innerHTML =
      "você jogou por: <b>" + jogando + "</b><br>" +
      "vezes que você abriu: <b>" + vezes + "</b><br>" +
      "voltas do loop: <b>" + st.volta + "</b><br>" +
      "coisas descobertas: <b>" + contaDescobertas() + " de " + TOTAL_DESCOBERTAS + "</b><br>" +
      "ações gastas: <b>" + st.acoes + "</b><br>" +
      "tempo que sobrou no relógio: <b>" + relogio() + "</b>";
    elTexto.appendChild(p);

    var q = document.createElement("p");
    q.className = "eco";
    q.textContent = "Teve alguma hora em que você quis fazer alguma coisa que não estava na lista? O quê?";
    elTexto.appendChild(q);

    elOpcoes.innerHTML = "";
    elOpcoes.appendChild(botao("- Recomeçar do zero", null, function () {
      st = { cs: TOTAL, volta: 1, lugar: "quarto1", sabe: {}, conhece: {}, vistos: {},
             mortos: {}, tem: {}, visitou: {}, acabou: false, estourou: false,
             dormiu: 0, acoes: 0, morrendo: false, trancou: false,
             perguntou: false, aberto: null, hudAtivo: true, pausado: false };
      pintaRelogio();
      abre("");
    }, "grupo"));
  }

  // ================= BOOT =================

  elClock.classList.add("escondido");
  pintaRelogio();
  abre("");
})();
</script>
